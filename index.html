
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANATECHYY | Creator Resources</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brandBlue: {
              50: '#eff6ff',
              100: '#dbeafe',
              600: '#0066FF', // Your exact Logo Electric Blue
              700: '#0052cc',
            },
            brandSlate: '#0F172A', // Your exact Logo Dark Slate
          }
        }
      }
    }
  </script>

  <style>
    /* Premium card transitions */
    .link-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px -8px rgba(0, 102, 255, 0.15);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen selection:bg-brandBlue-600 selection:text-white">

  <!-- Header / Navigation -->
  <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-4 md:px-8">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      
      <!-- Brand Logo Left -->
      <div class="flex items-center space-x-3">
        <div class="h-10 w-10">
          <!-- Custom SVG Recreating the Uploaded Logo -->
          <svg viewBox="0 0 500 500" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="250" cy="250" r="230" stroke="#0066FF" stroke-width="20" />
            <path d="M150 100 L250 190 V300 L195 250 V400 H150 V100 Z" fill="#0066FF" />
            <path d="M195 250 L250 190 V300 L195 250 Z" fill="#0044CC" opacity="0.3" />
            <path d="M350 100 L250 190 V300 L305 250 V400 H350 V100 Z" fill="#0F172A" />
            <path d="M250 190 L305 250 V300 L250 190 Z" fill="#0F172A" opacity="0.5" />
          </svg>
        </div>
        <div>
          <span class="text-lg font-black tracking-wider text-slate-900">
            MANA<span class="text-brandBlue-600">TECHYY</span>
          </span>
          <p class="text-[9px] text-slate-400 font-bold tracking-widest uppercase">Tech | Grow | Inspire</p>
        </div>
      </div>

      <!-- Instagram Navigation Link -->
      <div>
        <a href="https://instagram.com/manatechyy" target="_blank" class="inline-flex text-black items-center space-x-2 bg-purple-300 hover:bg-brandBlue-600 hover:text-white font-semibold px-4 py-2.5 rounded-xl text-xs md:text-sm transition-all shadow-md shadow-slate-900/10" title="Go to Instagram">
          <span>Instagram</span>
        </a>
      </div>

    </div>
  </nav>

  <!-- Hero Header Block -->
  <header class="bg-gradient-to-b from-brandBlue-50/60 to-transparent py-12 md:py-16 px-4">
    <div class="max-w-4xl mx-auto text-center space-y-4">
      <div class="inline-flex items-center space-x-2 bg-brandBlue-100 text-brandBlue-600 px-3.5 py-1 rounded-full text-xs font-bold tracking-wider uppercase">
        <i data-lucide="link" class="w-3.5 h-3.5"></i>
        <span>Link Directory</span>
      </div>
      
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-950 tracking-tight">
        Free Resources & Assets
      </h1>
      
      <p class="text-slate-500 text-xs md:text-sm max-w-md mx-auto leading-relaxed">
        Direct download and reference links featured in my latest design templates and developer guides. Click any link card below to access.
      </p>
    </div>
  </header>

  <!-- Link Cards Section -->
  <main class="flex-1 w-full max-w-2xl mx-auto px-4 pb-20">
    <div class="space-y-4" id="links-container">
      <!-- Injected dynamically via Javascript below -->
    </div>
  </main>

  <!-- Simple Footer -->
  <footer class="bg-white border-t border-slate-100 py-8 px-4 text-center">
    <p class="text-[11px] text-slate-400 font-medium">
      &copy; 2026 MANATECHYY. All resources belong to the creator.
    </p>
  </footer>

  <script>
    /*
      CREATOR RESOURCE REGISTRY:
      To update, add, or replace your links, simply change this clean array.
    */
    const MY_RESOURCES = [
      {
        title: "web development",
        desc: "best youtubechannels & resources",
        url: "https://drive.google.com/file/d/11qaa-K8BwtP_78WiOwB6yzYU8tt-907A/view?usp=drivesdk", // Replace with your real link
        icon:"apple"
      },
      {
        title: "Beginner HTML webpage",
        desc:"first HTML webpage for beginners",
        url:"https://drive.google.com/file/d/1XiWD_fdMz0E-XvGh__F5RcmO-4X5e10U/view?usp=drivesdk",
        icon:"link"
      }
      
    
    ];

    // Build lists dynamically with beautiful light styling
    function loadResources() {
      const container = document.getElementById('links-container');
      container.innerHTML = '';

      MY_RESOURCES.forEach(item => {
        const linkElement = document.createElement('a');
        linkElement.href = item.url;
        linkElement.target = "_blank";
        linkElement.className = "link-card block bg-white border border-slate-100 rounded-2xl p-5 shadow-sm hover:border-brandBlue-600/30 flex items-center justify-between gap-4";

        linkElement.innerHTML = `
          <div class="flex items-center space-x-4 min-w-0">
            <div class="p-3 bg-brandBlue-50 text-brandBlue-600 rounded-xl shrink-0">
              <i data-lucide="${item.icon || 'arrow-up-right'}" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0">
              <h3 class="text-sm font-bold text-slate-900 truncate">${item.title}</h3>
              <p class="text-xs text-slate-400 font-medium mt-0.5 leading-relaxed truncate md:whitespace-normal line-clamp-1">${item.desc}</p>
            </div>
          </div>
          <div class="p-1 text-slate-300 hover:text-brandBlue-600 transition-colors shrink-0">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </div>
        `;

        container.appendChild(linkElement);
      });

      // Load icons
      lucide.createIcons();
    }

    // Launch resource loading on ready state
    window.addEventListener('DOMContentLoaded', loadResources);
  </script>
</body>
</html>
